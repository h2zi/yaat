[package]
name = "yaat-codex-interop"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
age = "=0.12.1"
base64 = "=0.22.1"
chrono = "=0.4.45"
directories = "=6.0.0"
getrandom = "=0.3.4"
hex = "=0.4.3"
jsonc-parser = { version = "=0.33.1", features = ["cst"] }
keyring = { version = "=4.1.6", features = ["apple-native-keyring-store", "windows-native-keyring-store"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.26.0"
thiserror = "=2.0.19"
toml_edit = { version = "=0.25.13", features = ["serde"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4"] }
which = "=8.0.5"
yaat-contracts = { path = "../../crates/yaat-contracts" }
zeroize = { version = "=1.8.2", features = ["derive"] }
